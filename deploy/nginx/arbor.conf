# Arbor Core — nginx site configuration
#
# Replaces the default Mainsail config on the Raspberry Pi.
# Serves the Arbor WebUI as static files and reverse-proxies
# the API, WebSocket, and Moonraker endpoints.
#
# Install:
#   sudo cp deploy/nginx/arbor.conf /etc/nginx/sites-available/arbor
#   sudo ln -sf /etc/nginx/sites-available/arbor /etc/nginx/sites-enabled/arbor
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Task: D01

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # --- Static WebUI files ---------------------------------------------------
    # Built output lives inside the control-server package.
    root /opt/arbor/control-server/arbor_core/webui;
    index index.html;
    charset utf-8;

    # Gzip compression for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # NOTE: CORS is handled by the Arbor Core application layer.
    # Do NOT add Access-Control-* headers here — duplicate headers
    # cause browsers to reject responses.

    # --- Block access to hidden files (.env, .git, .htaccess, etc.) -----------
    location ~ /\. {
        deny all;
        return 404;
    }

    # --- WebSocket endpoint (must come before /api/ catch-all) ----------------
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Arbor Core REST API --------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large request bodies for firmware OTA and config file uploads
        client_max_body_size 4m;
    }

    # --- Health endpoint (top-level, no /api prefix) --------------------------
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Moonraker API proxy --------------------------------------------------
    # Moonraker's own WebSocket and REST API, accessible at /moonraker/
    location /moonraker/ {
        proxy_pass http://127.0.0.1:7125/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA routing ----------------------------------------------------------
    # All other paths fall through to index.html for client-side routing.
    # Static assets with file extensions are served directly; everything
    # else gets the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;

        # Prevent caching of index.html so users always get the latest
        # SPA entry point after deploys (Vite hashes JS/CSS filenames)
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        # Re-declare security headers (nginx add_header in child blocks
        # replaces parent headers, not appends)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Cache static assets (JS, CSS, images) aggressively — Vite uses
    # content-hashed filenames so immutable is safe.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        # Re-declare security headers (nginx add_header in child blocks
        # replaces parent headers, not appends)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # --- Logging --------------------------------------------------------------
    access_log /var/log/nginx/arbor-access.log;
    error_log /var/log/nginx/arbor-error.log;
}
