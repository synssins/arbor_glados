[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arbor-core"
version = "0.1.0"
description = "Arbor Control Server - Modular robotics control platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Chris Kliewer" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
keywords = ["robotics", "servo", "control", "fastapi", "esp32"]

# Core dependencies - approved in ARBOR_PROJECT_PLAN.md Section 4 & 13
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "argon2-cffi>=23.1.0",         # Argon2id hashing for API keys (DECISION_REQUEST_1)
    "PyJWT>=2.8.0",                # JWT RS256 tokens (DECISION_REQUEST_1)
    "cryptography>=42.0.0",        # RSA key ops for JWT RS256 (DECISION_REQUEST_1)
    "httpx>=0.26.0",               # Async HTTP client for node probing
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
    "httpx>=0.26.0",  # For testing FastAPI endpoints
]

[project.urls]
Homepage = "https://github.com/chriskliewer/arbor"
Documentation = "https://github.com/chriskliewer/arbor#readme"
Repository = "https://github.com/chriskliewer/arbor"

[project.scripts]
arbor = "arbor_core.main:main"

[project.entry-points."arbor.plugins"]
# Plugin entry points will be added here as plugins are developed

[tool.hatch.build.targets.wheel]
packages = ["arbor_core"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented out code)
    "PL",     # pylint
    "RUF",    # ruff-specific
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
]
ignore = [
    "PLR0913",  # Too many arguments - common in config classes
    "PLR2004",  # Magic value comparison - acceptable in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # assert is fine in tests
    "ARG001",   # unused arguments common in fixtures
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]

[tool.coverage.run]
source = ["arbor_core"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 80
